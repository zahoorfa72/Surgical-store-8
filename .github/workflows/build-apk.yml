name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable Corepack
        run: corepack enable

      - name: Check Expo environment
        run: |
          node --version
          yarn --version
          npx expo --version

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Generate clean Android project
        run: |
          rm -rf android
          npx expo prebuild --platform android --non-interactive --no-install

      - name: Validate Google OAuth configuration
        env:
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          validate_client_id() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "$name: MISSING"
              return 1
            fi
            if printf '%s' "$value" | grep -Eq '^[0-9]+-[A-Za-z0-9._-]+\.apps\.googleusercontent\.com          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false"
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean --no-daemon --max-workers=2
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: surgical-store-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
; then
              echo "$name: OK"
              return 0
            fi
            echo "$name: INVALID_FORMAT"
            return 1
          }
          failed=0
          validate_client_id "GOOGLE_ANDROID_CLIENT_ID" "$GOOGLE_ANDROID_CLIENT_ID" || failed=1
          validate_client_id "GOOGLE_IOS_CLIENT_ID" "$GOOGLE_IOS_CLIENT_ID" || failed=1
          validate_client_id "GOOGLE_WEB_CLIENT_ID" "$GOOGLE_WEB_CLIENT_ID" || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "One or more Google OAuth Client IDs are missing or malformed. Refusing to build an APK that would produce Google invalid_client errors."
            exit 1
          fi

      - name: Build release APK
        env:
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false"
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean --no-daemon --max-workers=2
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: surgical-store-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
