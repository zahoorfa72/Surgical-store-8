name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable Corepack
        run: corepack enable

      - name: Check Expo environment
        run: |
          node --version
          yarn --version
          npx expo --version

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Generate clean Android project
        run: |
          rm -rf android
          npx expo prebuild --platform android --non-interactive --no-install

      - name: Validate Google OAuth configuration
        env:
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID || '853810600390-91etcjfra1ht42f8ndcaie34qlabii32.apps.googleusercontent.com' }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_ANDROID_CLIENT_ID" ]; then
            echo "GOOGLE_ANDROID_CLIENT_ID: MISSING"
            exit 1
          elif printf '%s' "$GOOGLE_ANDROID_CLIENT_ID" | grep -Eq '^[0-9]+-[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$'; then
            echo "GOOGLE_ANDROID_CLIENT_ID: FORMAT_OK"
          else
            echo "GOOGLE_ANDROID_CLIENT_ID: INVALID_FORMAT"
            exit 1
          fi

          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "GOOGLE_WEB_CLIENT_ID: NOT_SET (optional for now)"
          elif printf '%s' "$GOOGLE_WEB_CLIENT_ID" | grep -Eq '^[0-9]+-[A-Za-z0-9._-]+\\.apps\\.googleusercontent\\.com$'; then
            ANDROID_PROJECT="${GOOGLE_ANDROID_CLIENT_ID%%-*}"
            WEB_PROJECT="${GOOGLE_WEB_CLIENT_ID%%-*}"
            if [ "$ANDROID_PROJECT" != "$WEB_PROJECT" ]; then
              echo "GOOGLE_WEB_CLIENT_ID: PROJECT_MISMATCH (Android=$ANDROID_PROJECT, Web=$WEB_PROJECT)"
              echo "Create the Web OAuth client in the same Google Cloud project as the Android OAuth client."
              exit 1
            fi
            echo "GOOGLE_WEB_CLIENT_ID: FORMAT_OK_AND_SAME_PROJECT"
          else
            echo "GOOGLE_WEB_CLIENT_ID: INVALID_FORMAT"
            exit 1
          fi

      - name: Build release APK
        env:
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID || '853810600390-91etcjfra1ht42f8ndcaie34qlabii32.apps.googleusercontent.com' }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false"
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean --no-daemon --max-workers=2
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Print APK SHA-1 fingerprint
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found in the Android SDK build-tools."
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi
          echo "APK SHA-1 fingerprint:"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | grep -E "Signer #|SHA-1 digest|SHA-256 digest"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: surgical-store-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
